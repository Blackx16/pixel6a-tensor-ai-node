name: Build APK & Deploy GitHub Pages Web Console

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable & Configure GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages -f build_type=workflow || \
          gh api -X PUT /repos/${{ github.repository }}/pages -f build_type=workflow || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Console Artifact (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-Installed Android SDK & NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          SDKMANAGER=$(ls -d ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Signing Keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias pixel6a_key \
            -storepass pixel6a_tensor_pass \
            -keypass pixel6a_tensor_pass \
            -dname "CN=Blackx16, OU=MobileAI, O=TensorAINode, L=Vadodara, S=GJ, C=IN"

      - name: Run Unit Tests & Assemble Signed Release APK
        run: |
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk pixel6a-tensor-ai-node-v0.1.apk
          cp app/build/outputs/apk/release/app-release.apk pixel6a-tensor-ai-node-v0.2.apk
          sha256sum pixel6a-tensor-ai-node-v0.1.apk > pixel6a-tensor-ai-node-v0.1.apk.sha256
          sha256sum pixel6a-tensor-ai-node-v0.2.apk > pixel6a-tensor-ai-node-v0.2.apk.sha256

      - name: Update v0.1 & v0.2 Releases with PNA CORS Support
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v0.1 >/dev/null 2>&1; then
            gh release upload v0.1 pixel6a-tensor-ai-node-v0.1.apk pixel6a-tensor-ai-node-v0.1.apk.sha256 --clobber
          fi
          if gh release view v0.2 >/dev/null 2>&1; then
            gh release upload v0.2 pixel6a-tensor-ai-node-v0.2.apk pixel6a-tensor-ai-node-v0.2.apk.sha256 --clobber
          fi
