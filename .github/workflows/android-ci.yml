name: Build & Release Pixel 6a APK (v0.1 & v0.2)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-Installed Android SDK & NDK
        run: |
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> $GITHUB_ENV
          SDKMANAGER=$(ls -d ${ANDROID_HOME}/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Release Signing Keystore
        run: |
          mkdir -p keystore
          keytool -genkeypair -v \
            -keystore keystore/release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias pixel6a_key \
            -storepass pixel6a_tensor_pass \
            -keypass pixel6a_tensor_pass \
            -dname "CN=Blackx16, OU=MobileAI, O=TensorAINode, L=Vadodara, S=GJ, C=IN"

      - name: Run Unit Tests & Assemble Signed Release APK
        run: |
          gradle testDebugUnitTest assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk pixel6a-tensor-ai-node-v0.1.apk
          cp app/build/outputs/apk/release/app-release.apk pixel6a-tensor-ai-node-v0.2.apk
          sha256sum pixel6a-tensor-ai-node-v0.1.apk > pixel6a-tensor-ai-node-v0.1.apk.sha256
          sha256sum pixel6a-tensor-ai-node-v0.2.apk > pixel6a-tensor-ai-node-v0.2.apk.sha256
          ls -lh pixel6a-tensor-ai-node-v0.*.apk*

      - name: Update v0.1 Release & Publish v0.2 Bugfix Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release_notes.md
          ### Pixel 6a TensorAI Node (Signed ARM64 APK — Fixed "Run on Phone" & Image Vision/Embeddings)
          - **Bugfix #1 ("Run on Phone" Crash Fixed)**: Added `CoroutineExceptionHandler` crash guards, fixed MediaPipe `.tflite` disk loading (`MappedByteBuffer` via `setModelAssetBuffer` instead of `setModelAssetPath`), added dynamic ONNX `session.inputInfos` tensor allocation (`position_ids`, `token_type_ids`, `past_key_values`), and auto-routed Embedding models (`all-minilm-l6-v2-onnx`, `universal-sentence-encoder-litert`) so "RUN ON PHONE" never crashes.
          - **Bugfix #2 ("+ IMAGE" Vision & Embedding Output)**: Added `VisionImageAnalyzer` with immediate image thumbnail preview, dominant color palette, lighting/edge analysis, and 384-D L2-normalized visual embedding extraction right when an image is picked and when "RUN ON PHONE" is tapped.
          - **Voice Pipeline**: Unchanged and preserved intact.
          EOF
          if gh release view v0.1 >/dev/null 2>&1; then
            gh release upload v0.1 pixel6a-tensor-ai-node-v0.1.apk pixel6a-tensor-ai-node-v0.1.apk.sha256 --clobber
            gh release edit v0.1 --notes-file release_notes.md
          fi
          if gh release view v0.2 >/dev/null 2>&1; then
            gh release upload v0.2 pixel6a-tensor-ai-node-v0.2.apk pixel6a-tensor-ai-node-v0.2.apk.sha256 --clobber
          else
            gh release create v0.2 \
              pixel6a-tensor-ai-node-v0.2.apk \
              pixel6a-tensor-ai-node-v0.2.apk.sha256 \
              --title "v0.2 — Fix Run on Phone Crash & Image Vision/Embeddings Output" \
              --notes-file release_notes.md
          fi
